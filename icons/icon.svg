<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Shape -->
  <path d="M256 96 L384 144 V268 C384 348 256 416 256 416 C256 416 128 348 128 268 V144 Z" fill="#ffffff" opacity="0.95" />

  <!-- Exclamation / Alert icon inside shield -->
  <path d="M256 160 V280" stroke="#2563eb" stroke-width="28" stroke-linecap="round" />
  <circle cx="256" cy="336" r="16" fill="#2563eb" />

  <!-- Mini severity meter accent at bottom -->
  <rect x="176" y="376" width="160" height="14" rx="7" fill="url(#meterGrad)" />
</svg>
